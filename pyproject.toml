[project]
name = "trina"
version = "0.1.0"
description = "Training system for a memory-retrieval and context-assembly neural network"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[project.scripts]
trina = "trina.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
