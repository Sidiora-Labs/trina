# Synthetic credentials for tests/cases/test_0_4.py. Every value here is invented:
# none was ever issued by a provider. Each case gives the text, what redaction must
# return, and the count by kind; "gone" lists substrings that must not survive.
#
# No credential shape is written out whole: each one is split by the join marker,
# an opening brace, a plus sign and a closing brace, which the test removes when it
# loads this file. The full value exists only in memory, and the hygiene gate scans
# this file like any other.

# -- api_key ----------------------------------------------------------------------

[[case]]
name = "provider key"
text = "client = Client('sk-{+}SYNTHETICa1B2c3D4e5F6g7H8i9J0')"
expect = "client = Client('[REDACTED:api_key]')"
counts = { api_key = 1 }
gone = ["SYNTHETICa1B2c3D4e5F6g7H8i9J0"]

[[case]]
name = "hub key"
text = "login with hf_{+}SYNTHETICa1B2c3D4e5F6g7H8i9J0k1 today"
expect = "login with [REDACTED:api_key] today"
counts = { api_key = 1 }
gone = ["SYNTHETICa1B2c3D4e5F6g7H8i9J0k1"]

[[case]]
name = "maps-style key"
text = "key AIza{+}SYNTHETICa1B2c3D4e5F6g7H8i9J0k1L2m3 ok"
expect = "key [REDACTED:api_key] ok"
counts = { api_key = 1 }
gone = ["SYNTHETICa1B2c3D4e5F6g7H8i9J0k1L2m3"]

[[case]]
name = "chat workspace key"
text = "bot xoxb-{+}000000000000-SYNTHETICa1B2c3 joined"
expect = "bot [REDACTED:api_key] joined"
counts = { api_key = 1 }
gone = ["000000000000-SYNTHETICa1B2c3"]

# -- cloud_token ------------------------------------------------------------------

[[case]]
name = "cloud access key id"
text = "id AKIA{+}SYNTHETIC0000001 and ASIA{+}SYNTHETIC0000002"
expect = "id [REDACTED:cloud_token] and [REDACTED:cloud_token]"
counts = { cloud_token = 2 }
gone = ["SYNTHETIC0000001", "SYNTHETIC0000002"]

[[case]]
name = "cloud secret key"
text = "aws_secret_access_key = {+}SYNTHETIC0a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5"
expect = "aws_secret_access_key = [REDACTED:cloud_token]"
counts = { cloud_token = 1 }
gone = ["SYNTHETIC0a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5"]

# -- repo_token -------------------------------------------------------------------

[[case]]
name = "hosting token"
text = "git clone with ghp_{+}SYNTHETIC0a1B2c3D4e5F6g7H8i9J0k1L2m3N done"
expect = "git clone with [REDACTED:repo_token] done"
counts = { repo_token = 1 }
gone = ["SYNTHETIC0a1B2c3D4e5F6g7H8i9J0k1L2m3N"]

[[case]]
name = "fine-grained hosting token"
text = "github_pat_{+}SYNTHETIC0a1B2c3D4e5F6g7H8"
expect = "[REDACTED:repo_token]"
counts = { repo_token = 1 }
gone = ["SYNTHETIC0a1B2c3D4e5F6g7H8"]

[[case]]
name = "second hosting token"
text = "use glpat-{+}SYNTHETIC0a1B2c3D4e5F here"
expect = "use [REDACTED:repo_token] here"
counts = { repo_token = 1 }
gone = ["SYNTHETIC0a1B2c3D4e5F"]

[[case]]
name = "registry tokens"
text = "npm_{+}SYNTHETIC0a1B2c3D4e5F6g7H8i9J0k1L2m3 and pypi-{+}SYNTHETIC0a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8s9T0u1"
expect = "[REDACTED:repo_token] and [REDACTED:repo_token]"
counts = { repo_token = 2 }
gone = ["SYNTHETIC0a1B2c3D4e5F6g7H8i9J0k1L2m3"]

# -- bearer: header values, web tokens, signed URLs, URL credentials

[[case]]
name = "bearer token"
text = "curl -H 'Authorization: Bearer {+}SYNTHETIC.a1B2c3D4e5F6g7H8' https://example.test"
expect = "curl -H 'Authorization: Bearer [REDACTED:bearer]' https://example.test"
counts = { bearer = 1 }
gone = ["SYNTHETIC.a1B2c3D4e5F6g7H8"]

[[case]]
name = "short token after the header name"
text = "authorization: token SYNTH1c9"
expect = "authorization: token [REDACTED:bearer]"
counts = { bearer = 1 }
gone = ["SYNTH1c9"]

[[case]]
name = "basic authorization value"
# base64 of "synthetic-user:synthetic-pass"
text = "Proxy uses Basic {+}c3ludGhldGljLXVzZXI6c3ludGhldGljLXBhc3M= for now"
expect = "Proxy uses Basic [REDACTED:bearer] for now"
counts = { bearer = 1 }
gone = ["c3ludGhldGljLXVzZXI6c3ludGhldGljLXBhc3M"]

[[case]]
name = "web token"
text = "session eyJTWU5USEVUSUMx.{+}eyJTWU5USEVUSUMy.SYNTHETICsig0a1B2 expired"
expect = "session [REDACTED:bearer] expired"
counts = { bearer = 1 }
gone = ["eyJTWU5USEVUSUMx", "SYNTHETICsig0a1B2"]

[[case]]
name = "signed URL"
text = "GET https://bucket.example.test/o?X-Amz-Date=20260101&X-Amz-{+}Signature=5ynthet1c0a1b2c3d4e5f&x=1"
expect = "GET https://bucket.example.test/o?X-Amz-Date=20260101&X-Amz-Signature=[REDACTED:bearer]&x=1"
counts = { bearer = 1 }
gone = ["5ynthet1c0a1b2c3d4e5f"]

[[case]]
name = "credentials in a URL"
text = "remote https://synthetic-user:{+}synthetic-pass@git.example.test/repo.git"
expect = "remote https://[REDACTED:bearer]@git.example.test/repo.git"
counts = { bearer = 1 }
gone = ["synthetic-user", "synthetic-pass"]

# -- private_key ------------------------------------------------------------------

[[case]]
name = "private key block"
text = """
before
-----BEGIN RSA {+}PRIVATE KEY-----
SYNTHETICKEYMATERIAL0a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8s9T0u1V
SYNTHETICKEYMATERIAL1a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8s9T0==
-----END RSA PRIVATE KEY-----
after
"""
expect = """
before
[REDACTED:private_key]
after
"""
counts = { private_key = 1 }
gone = ["SYNTHETICKEYMATERIAL", "PRIVATE KEY"]

[[case]]
name = "unterminated private key block"
text = "key: -----BEGIN OPENSSH {+}PRIVATE KEY-----\nSYNTHETICKEYMATERIAL2a1B2c3D4e5F6g7H8\nSYNTHETICKEYMATERIAL3"
expect = "key: [REDACTED:private_key]"
counts = { private_key = 1 }
gone = ["SYNTHETICKEYMATERIAL"]

# -- assignment -------------------------------------------------------------------

[[case]]
name = "environment file"
text = "DEBUG=1\nexport OPENAI_API_KEY=synthetic-value-9\nDB_PASSWORD=syntheticpw\n"
expect = "DEBUG=1\nexport OPENAI_API_KEY=[REDACTED:assignment]\nDB_PASSWORD=[REDACTED:assignment]\n"
counts = { assignment = 2 }
gone = ["synthetic-value-9", "syntheticpw"]

[[case]]
name = "code with a quoted value"
text = "password = \"synthetic pass phrase\"\nclient_secret='s'\n"
expect = "password = \"[REDACTED:assignment]\"\nclient_secret='[REDACTED:assignment]'\n"
counts = { assignment = 2 }
gone = ["synthetic pass phrase"]

[[case]]
name = "JSON"
text = "{\"user\": \"ada\", \"accessToken\": \"synthetic-json-value\", \"api_key\": \"k9\"}"
expect = "{\"user\": \"ada\", \"accessToken\": \"[REDACTED:assignment]\", \"api_key\": \"[REDACTED:assignment]\"}"
counts = { assignment = 2 }
gone = ["synthetic-json-value", "k9"]

[[case]]
name = "JSON escaped inside a string"
text = "body={\\\"password\\\": \\\"synthetic-escaped\\\"}"
expect = "body={\\\"password\\\": \\\"[REDACTED:assignment]\\\"}"
counts = { assignment = 1 }
gone = ["synthetic-escaped"]

[[case]]
name = "unquoted shell, query and YAML forms"
text = "run --token=synth3tic9 ; GET /x?api_key=synth3tic8&y=2\npassword: synth3tic7\n"
expect = "run --token=[REDACTED:assignment] ; GET /x?api_key=[REDACTED:assignment]&y=2\npassword: [REDACTED:assignment]\n"
counts = { assignment = 3 }
gone = ["synth3tic"]

# -- ip_address -------------------------------------------------------------------

[[case]]
name = "IPv4"
text = "peer 203.0.113.7 connected, then 10.0.0.1."
expect = "peer [DROPPED:ip_address] connected, then [DROPPED:ip_address]."
counts = { ip_address = 2 }
gone = ["203.0.113.7", "10.0.0.1"]

[[case]]
name = "IPv6"
text = "from 2001:db8::8a2e:370:7334 via [fe80::1]:8080 and ::ffff:192.0.2.9 or ::1"
expect = "from [DROPPED:ip_address] via [[DROPPED:ip_address]]:8080 and [DROPPED:ip_address] or [DROPPED:ip_address]"
counts = { ip_address = 4 }
gone = ["2001:db8", "fe80", "192.0.2.9"]

# -- installation_id --------------------------------------------------------------

[[case]]
name = "installation identifier assignments"
text = "installation_id=synthetic-install-0001 deviceId: \"SYNTH-DEVICE-2\"\nX-Machine-Id: synth.machine.3"
expect = "installation_id=[DROPPED:installation_id] deviceId: \"[DROPPED:installation_id]\"\nX-Machine-Id: [DROPPED:installation_id]"
counts = { installation_id = 3 }
gone = ["synthetic-install-0001", "SYNTH-DEVICE-2", "synth.machine.3"]

[[case]]
name = "hardware address"
text = "nic 02:00:5e:10:00:ff up"
expect = "nic [DROPPED:installation_id] up"
counts = { installation_id = 1 }
gone = ["02:00:5e:10:00:ff"]

